<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Koinos AI — Dashboard</title>
<meta name="robots" content="noindex" />
<style>
:root{
  --ink:#0A0A0C; --panel:#111117; --panel-2:#15151c;
  --line:#22222b; --line-2:#2f2f3a;
  --text:#F4F3F0; --soft:#d7d6d9; --muted:#a6a4b0; --faint:#7d7c89;
  --signal:#33E6C0; --signal-dim:#1c8f7c;
  --value:#F2B03D; --danger:#ff6b6b;
  --r:14px;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  --sans:"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{width:min(760px,calc(100% - 32px));margin:0 auto;padding:40px 0 72px}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--signal);font-weight:600;margin:0}
h1{font-size:clamp(26px,4vw,34px);margin:.3em 0 .35em}
.muted{color:var(--muted);font-size:13.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:14px 0}
.btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:13px;font-weight:600;
  padding:11px 15px;border-radius:11px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);
  cursor:pointer;transition:border-color .15s}
.btn:hover{border-color:#463f5a}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin:-4px 0 18px}
.sect{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:30px 0 8px}
.addr{font-family:var(--mono);font-size:12px;color:var(--muted);word-break:break-all;margin-bottom:8px}

.node-state{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.node-dot{width:8px;height:8px;border-radius:50%;background:#8b98a9;flex-shrink:0}
.node-dot.ok{background:#34d399}
.node-dot.busy{background:#38bdf8}
.node-dot.off{background:#f87171}
.node-models{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.node-models .chip{font-size:.82em;padding:2px 8px;border-radius:999px;border:1px solid #1c2430;background:#10161d;color:#8b98a9}
.node-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:.9em}
.node-grid .k{color:#8b98a9}

/*
 * Tiles wrap to whatever fits. The floor is deliberately low: at 140px a
 * phone gets ONE tile per row, which turned four figures into four full
 * screens of scrolling. Two-up is the minimum that still reads as a summary.
 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin:14px 0 4px}
.tile{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .t-label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.tile .t-value{font-size:18px;font-weight:650;margin:3px 0 1px}
.tile .t-sub{font-size:11px;color:var(--muted);line-height:1.35}
.note{font-size:12.5px;color:var(--muted);margin:12px 0 0}
.note.warn{color:var(--value)}
.stamp{font-size:11px;color:var(--faint);margin-top:10px}
.empty{color:var(--muted);font-size:14px}

@media (max-width:420px){
  .wrap{width:calc(100% - 24px);padding:28px 0 56px}
  .card{padding:15px}
  .tiles{gap:8px}
}
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">Koinos AI</p>
  <h1>Dashboard</h1>
  <p class="nav">
    <a class="btn" href="/app">Chat</a>
    <a class="btn" href="/account">Account</a>
  </p>
  <p class="muted" id="lede">Everything your machines are doing, in one place.</p>

  <div class="sect">AI nodes — answering chat for the network</div>
  <div id="ai"><p class="empty">Loading…</p></div>

  <div class="sect">Koinos nodes — producing blocks</div>
  <div id="koinos"><p class="empty">Loading…</p></div>

  <p class="stamp" id="stamp"></p>
</div>
<script src="/dashboard.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Koinos AI — Updates</title>
<meta name="description" content="What changed in each release of Koinos AI — new features, fixes, and why they were made." />
<style>
:root{
  --ink:#0A0A0C; --panel:#111117; --panel-2:#15151c;
  --line:#22222b; --line-2:#2f2f3a;
  --text:#F4F3F0; --soft:#d7d6d9; --muted:#a6a4b0; --faint:#7d7c89;
  --signal:#33E6C0; --signal-dim:#1c8f7c;
  --value:#F2B03D; --danger:#ff6b6b;
  --r:14px;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  --sans:"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{width:min(720px,calc(100% - 32px));margin:0 auto;padding:40px 0 80px}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--signal);font-weight:600;margin:0}
h1{font-size:clamp(26px,4vw,34px);margin:.3em 0 .35em}
.lede{color:var(--muted);font-size:14.5px;margin:0 0 20px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin:-4px 0 20px}
.btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:13px;font-weight:600;
  padding:11px 15px;border-radius:11px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);
  text-decoration:none;cursor:pointer;transition:border-color .15s}
.btn:hover{border-color:#463f5a}

.rel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:14px 0;scroll-margin-top:20px}
/* Arriving from the app's update popup, which deep-links to #v0.47.2. The
   whole point of that link is "what did I just install" — so the version it
   asked for has to be findable without reading every card. */
.rel:target,.rel.hilite{border-color:var(--signal-dim);box-shadow:0 0 0 1px var(--signal-dim)}
.rel-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.ver{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--signal);text-decoration:none}
.ver:hover{text-decoration:underline}
.date{font-family:var(--mono);font-size:12px;color:var(--faint)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;border-radius:999px;border:1px solid var(--signal-dim);color:var(--signal)}
.rel h2{font-size:16.5px;margin:0 0 12px;color:var(--soft);font-weight:600}
ul{list-style:none;padding:0;margin:0}
li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;color:var(--soft)}
li:first-child{border-top:0}
.kind{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:5px;flex-shrink:0;margin-top:3px;height:fit-content;min-width:52px;text-align:center}
.kind.new{background:rgba(51,230,192,.12);color:var(--signal);border:1px solid rgba(51,230,192,.3)}
.kind.fix{background:rgba(242,176,61,.12);color:var(--value);border:1px solid rgba(242,176,61,.3)}
.kind.change{background:rgba(166,164,176,.1);color:var(--muted);border:1px solid var(--line-2)}
.empty{color:var(--muted);font-size:14px}
.foot{font-size:12px;color:var(--faint);margin-top:26px}

@media (max-width:480px){
  .wrap{width:calc(100% - 24px);padding:28px 0 56px}
  .rel{padding:15px}
  li{flex-direction:column;gap:4px}
  /* A flex child in a column stretches to the full width by default, which
     turned a 52px tag into something that reads as a full-width button.
     align-self shrinks it back to its own size. */
  .kind{margin-top:0;align-self:flex-start;min-width:0}
}
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">Koinos AI</p>
  <h1>Updates</h1>
  <p class="lede">Every release, what changed in it, and why. Newest first.</p>
  <p class="nav">
    <a class="btn" href="/">Home</a>
    <a class="btn" href="/docs/">Docs</a>
    <a class="btn" href="/dashboard">Dashboard</a>
  </p>

  <div id="list"><p class="empty">Loading…</p></div>

  <p class="foot" id="foot"></p>
</div>
<script src="/updates.js"></script>
</body>
</html>

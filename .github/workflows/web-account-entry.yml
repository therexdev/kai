name: Website network account entry
on:
  pull_request:
  workflow_dispatch:
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test tests/web-account-entry.test.js tests/account-login-navigation.test.js tests/beta-launch.test.js
      - run: node --check server.js

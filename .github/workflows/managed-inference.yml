name: Managed network inference
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  billing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify billing, daily credits, routing, receipts and reward exclusion
        run: >-
          node -e 'require("node:child_process").execFileSync(process.execPath, ["--test", "--test-concurrency=2", ...require("./deploy/koin-mainnet/update-managed-inference").PROBES], { stdio: "inherit" })'
      - name: Verify native tool transport and idempotent recovery
        run: node --test scripts/probe-native-tools.js scripts/probe-native-qualification.js
      - name: Verify qualified route activation and resumable clean restart
        run: node --test deploy/koin-mainnet/activate-qualified-native.test.js deploy/koin-mainnet/qualify-native-models.test.js deploy/koin-mainnet/native-rollout-release.test.js
      - run: node --check test-server.js

name: KOIN isolated transfers
on:
  push:
    branches: [claude/koin-shadow-integration]
    paths: ["lib/koin-network/**", "scripts/koin-isolated/**", ".github/workflows/koin-isolated.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  custody-and-mana:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: kai-isolated-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Choose disposable runner directory
        run: echo "KAI_ISOLATED_DIR=$RUNNER_TEMP/kai-isolated" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/checkout@v4
        with:
          repository: koinos/koinos-integration-tests
          ref: 74b64d739a98045630cb61557e1f141c04cd1eb1
          path: isolated-upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: therexdev/kaiapp
          ref: 3327a075c0b5c7ba0102dd9492e808ff93b3e46b
          path: isolated-desktop
          persist-credentials: false
      - name: Build pinned custody contracts
        run: |
          npm ci --ignore-scripts --prefix isolated-desktop/contracts/koin-network
          npm run build --prefix isolated-desktop/contracts/koin-network
      - name: Prepare fresh peerless chain
        run: node scripts/koin-isolated/prepare.js isolated-upstream isolated-desktop "$KAI_ISOLATED_DIR"
      - name: Start isolated node
        run: |
          docker compose -f "$KAI_ISOLATED_DIR/compose.json" up -d
          docker compose -f "$KAI_ISOLATED_DIR/compose.json" images --format json > "$KAI_ISOLATED_DIR/images.json"
      - name: Verify native transfers, recovery and Mana
        run: bash scripts/koin-isolated/run-in-network.sh "$KAI_ISOLATED_DIR"
      - name: Collect node diagnostics
        if: always()
        run: |
          if [ -f "$KAI_ISOLATED_DIR/compose.json" ]; then
            docker compose -f "$KAI_ISOLATED_DIR/compose.json" logs --no-color > "$KAI_ISOLATED_DIR/node.log" 2>&1
            docker compose -f "$KAI_ISOLATED_DIR/compose.json" logs --no-color --tail 30 chain jsonrpc
          fi
      - name: Save isolated result and measured receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koin-isolated-transfer-mana
          path: |
            ${{ runner.temp }}/kai-isolated/report.json
            ${{ runner.temp }}/kai-isolated/manifest.json
            ${{ runner.temp }}/kai-isolated/images.json
            ${{ runner.temp }}/kai-isolated/node.log
          if-no-files-found: warn
      - name: Remove only this disposable chain
        if: always()
        run: |
          if [ -f "$KAI_ISOLATED_DIR/compose.json" ]; then
            docker compose -f "$KAI_ISOLATED_DIR/compose.json" down --volumes
          fi

name: KOIN pilot regression tests
on:
  push:
    branches: [codex/koin-mainnet-pilot, work/wallet-first-access-20261027]
    paths: ["lib/koin-network/**", "lib/scheduler.js", "scripts/probe-koin*.js", "scripts/probe-purchase-quotes-http.js", "scripts/helpers/koin-*.js", "deploy/koin-mainnet/**", "deploy/koin-test/**", "test-server.js", ".github/workflows/koin-pilot.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: node --test --test-concurrency=2 scripts/probe-koin*.js scripts/probe-purchase-quotes-http.js deploy/koin-mainnet/update-purchase-quotes.test.js deploy/koin-mainnet/update-provider-qualification.test.js
      - run: node --check test-server.js
